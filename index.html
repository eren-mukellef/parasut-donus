<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Paraşüt dönüş yönlendirmesi</title>
<style>
  body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: #F9FAFB; color: #101828; }
  main { max-width: 560px; margin: 80px auto; padding: 0 16px; }
  .kart { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 24px; }
  code { background: #F2F4F7; border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<main>
  <div class="kart">
    <h1 style="font-size:18px;margin:0 0 8px">Paraşüt dönüş yönlendirmesi</h1>
    <p id="durum">Bu sayfa Robom veri aktarımı prototipinin test yönlendirmesidir. Paraşüt onayından sonra tarayıcıyı bu bilgisayardaki prototipe (<code>localhost:8765</code>) iletir. Hiçbir veri saklamaz.</p>
  </div>
</main>
<script>
  // Paraşüt yalnız https geri dönüş adresi kabul ediyor; bu sayfa gelen code/state/error değerlerini
  // olduğu gibi yerel prototipe aktarır. Değerler hiçbir yere kaydedilmez veya gönderilmez.
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return;
    var hedef = 'http://localhost:8765/parasut/donus' + location.search;
    document.getElementById('durum').textContent = 'Prototipe yönlendiriliyorsunuz…';
    location.replace(hedef);
  })();
</script>
</body>
</html>
